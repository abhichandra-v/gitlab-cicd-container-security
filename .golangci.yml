---
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
  exclusions:
    rules:
      # Tests call http.Get and net.Listen directly; a context adds nothing.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
