---
# Pipeline for orders-api. docs/PIPELINE.md explains every stage and gate.
#
# Every image is pinned by tag and digest. To update one, change it here and
# in build/toolbox/Dockerfile (docs/RUNBOOK.md, "Updating pinned versions").

# One pipeline per change: merge request pipelines when an MR is open,
# branch pipelines otherwise, and tag pipelines for releases.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build
  - scan
  - deploy-test
  - deploy
  - release

variables:
  GO_IMAGE: "golang:1.27.2@sha256:007a316059246276cb214df93950be77837545dc78007a73e0291a4963d5d3bf"
  GOLANGCI_IMAGE: "golangci/golangci-lint:v2.14.0-alpine@sha256:25925c95ebdc7aee39ecc0e6f4f33ac27b9a91718bc65fdf18a1a5c4c9325ee4"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552"
  KANIKO_IMAGE: "ghcr.io/osscontainertools/kaniko:v1.28.6-debug@sha256:7ab44d0131c3051b6dea128067e258c7afb5c4815082a93b9cf6c624f2140bf0"
  CRANE_IMAGE: "gcr.io/go-containerregistry/crane/debug:v0.22.1@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b"
  DOCKER_IMAGE: "docker:29.9.0-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00"
  DIND_IMAGE: "docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470"
  TRIVY_IMAGE: "aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa"
  CHECKOV_IMAGE: "bridgecrew/checkov:3.3.28@sha256:19ab1e9a08bf76f78391ca6fa46bb62fd08737e4e66466b16a82aa2d1337e153"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
  KUBE_SCORE_IMAGE: "zegl/kube-score:v1.20.0@sha256:ac4c43ad560af905d66f6bf57b0937c591332e6dbf2167c31193a13b4695ab97"
  KUBECONFORM_IMAGE: "ghcr.io/yannh/kubeconform:v0.8.0-alpine@sha256:6b90a5f23d846140ce0194fe050b1995e546eba938f3a6bf10c039dd5e24588f"
  KUSTOMIZE_IMAGE: "registry.k8s.io/kustomize/kustomize:v5.8.3@sha256:429eda4a1c76a7de458d0c4ca3ded9b5d764899ff6bdaeccc1d98b1b6ee873e4"
  ALPINE_IMAGE: "alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  GLAB_IMAGE: "registry.gitlab.com/gitlab-org/cli:v1.118.0@sha256:3f0a591b3b96c39ac8e28480ee99bb93201b7bcea1fbca7ed50c034098111db2"
  GOTESTSUM_VERSION: "v1.13.0"
  # Release binaries fetched by scripts/fetch-verified.sh (SHA-256 checked).
  KIND_VERSION: "v0.33.0"
  KIND_SHA256: "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d"
  KUBECTL_VERSION: "v1.37.1"
  KUBECTL_SHA256: "65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8"
  # Kubernetes version the manifests are validated against (kind node image).
  KUBERNETES_VERSION: "1.37.0"

  # Go caches live inside the project directory so GitLab can cache them.
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  GOFLAGS: "-mod=readonly"

  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_NO_PROGRESS: "true"

  # Set to "true" (project or group CI/CD variable) only where the runner
  # allows privileged containers. It enables the kind-based deploy-test job,
  # which needs docker-in-docker. Everything else runs unprivileged.
  PRIVILEGED_RUNNER: "false"

  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_BRANCH: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

default:
  interruptible: true
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.go-cache:
  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/
      - .cache/

# Docker-in-Docker with TLS between the job and the daemon. Needs a
# privileged runner; only the optional deploy-test job uses it.
.dind:
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for the docker daemon ($i/30)"
        sleep 2
      done
      docker info --format 'docker daemon {{.ServerVersion}} ready'

# ---------------------------------------------------------------- lint ----

go-lint:
  stage: lint
  image: $GOLANGCI_IMAGE
  extends: .go-cache
  needs: []
  script:
    - golangci-lint run --timeout 5m ./...

hadolint:
  stage: lint
  image: $HADOLINT_IMAGE
  needs: []
  script:
    - hadolint Dockerfile build/naive/Dockerfile build/distroless/Dockerfile build/toolbox/Dockerfile

# ---------------------------------------------------------------- test ----

go-test:
  stage: test
  # Full Debian-based Go image: the race detector needs cgo and a C compiler.
  image: $GO_IMAGE
  extends: .go-cache
  needs: []
  script:
    - go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
    - go vet ./...
    - >
      "$GOPATH/bin/gotestsum" --format testname --junitfile junit.xml --
      -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage.out
      - coverage.html
    reports:
      junit: junit.xml

# --------------------------------------------------------------- build ----

build-image:
  stage: build
  # Kaniko builds the Dockerfile in user space: no Docker daemon and no
  # privileged container, so this job runs on any runner.
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  needs:
    - go-lint
    - hadolint
    - go-test
  script:
    - mkdir -p /kaniko/.docker
    - >
      printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}'
      "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD"
      > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --destination "$IMAGE_SHA"
      --destination "$IMAGE_BRANCH"
      --digest-file "$CI_PROJECT_DIR/digest.txt"
    # Later jobs use the digest, not a tag, so they scan and deploy exactly
    # the bytes that were built here.
    - IMAGE_REF="$CI_REGISTRY_IMAGE@$(cat "$CI_PROJECT_DIR/digest.txt")"
    - echo "IMAGE_REF=$IMAGE_REF" | tee build.env
    - echo "$IMAGE_REF" > image-digest.txt
  artifacts:
    expire_in: 30 days
    paths:
      - image-digest.txt
    reports:
      dotenv: build.env

# ---------------------------------------------------------------- scan ----
# Every job in this stage exits non-zero on findings, which fails the
# pipeline. Suppressions live in .trivyignore.yaml and as inline Checkov
# skips, each with a justification and a review date (docs/SECURITY.md).
# Jobs that do not need the image use `needs: []` and start immediately.

.trivy:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  cache:
    key: trivy-db
    paths:
      - .trivycache/

trivy-fs:
  extends: .trivy
  needs: []
  script:
    - trivy --version
    # Scan once to JSON (kept as an artifact), then print the table from
    # that JSON. The convert step is the gate: it exits 1 on any finding.
    - trivy fs --scanners vuln,secret,misconfig --format json --output trivy-fs.json .
    - trivy convert --format table --exit-code 1 trivy-fs.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-fs.json

trivy-config:
  extends: .trivy
  # Scans the Dockerfiles, the raw manifests and the rendered overlays.
  needs:
    - render-manifests
  script:
    - trivy config --format json --output trivy-config.json .
    - trivy convert --format table --exit-code 1 trivy-config.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-config.json

trivy-image:
  extends: .trivy
  # IMAGE_REF (repository@digest) arrives through build-image's dotenv report.
  needs:
    - build-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - sh scripts/scan-image.sh "$IMAGE_REF" reports
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/trivy-image.json
      - reports/trivy-image.txt
    reports:
      container_scanning: reports/gl-container-scanning-report.json

checkov:
  stage: scan
  image:
    name: $CHECKOV_IMAGE
    entrypoint: [""]
  # With rendered/ present, Checkov also scores what kustomize produces.
  needs:
    - render-manifests
  script:
    - checkov --version
    - >
      checkov --config-file .checkov.yaml
      --output cli --output junitxml
      --output-file-path console,checkov-junit.xml
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit: checkov-junit.xml

gitleaks:
  stage: scan
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  needs: []
  variables:
    # Full history: a secret removed in a later commit is still a leak.
    GIT_DEPTH: "0"
  script:
    - >
      gitleaks git --redact --no-banner --exit-code 1
      --report-format json --report-path gitleaks-report.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks-report.json

sbom:
  extends: .trivy
  needs:
    - build-image
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --format cyclonedx --output sbom.cdx.json "$IMAGE_REF"
  artifacts:
    expire_in: 90 days
    paths:
      - sbom.cdx.json
    reports:
      cyclonedx: sbom.cdx.json

# Renders both overlays once. kube-score, kubeconform, trivy-config and
# checkov all validate these files, so they all judge the same output.
render-manifests:
  stage: scan
  image:
    name: $KUSTOMIZE_IMAGE
    entrypoint: [""]
  needs: []
  script:
    - /app/kustomize version
    - mkdir -p rendered
    - /app/kustomize build k8s/overlays/dev > rendered/dev.yaml
    - /app/kustomize build k8s/overlays/prod > rendered/prod.yaml
    - wc -l rendered/*.yaml
  artifacts:
    expire_in: 30 days
    paths:
      - rendered/

kubeconform:
  stage: scan
  image:
    name: $KUBECONFORM_IMAGE
    entrypoint: [""]
  needs:
    - render-manifests
  script:
    # -strict rejects unknown and duplicate fields, so a typo in a manifest
    # fails here instead of being silently dropped by the API server.
    - /kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" rendered/dev.yaml rendered/prod.yaml

kube-score:
  stage: scan
  image:
    name: $KUBE_SCORE_IMAGE
    entrypoint: [""]
  needs:
    - render-manifests
  script:
    - kube-score version
    - kube-score score --kubernetes-version "v${KUBERNETES_VERSION%.*}" --exit-one-on-warning rendered/dev.yaml
    - kube-score score --kubernetes-version "v${KUBERNETES_VERSION%.*}" --exit-one-on-warning rendered/prod.yaml

# --------------------------------------------------------- deploy-test ----

# Runs the image that was just built as a service container next to the job
# and smoke-tests it over HTTP. Needs no privileges, so it runs everywhere,
# and only after every scan gate has passed.
smoke-test:
  stage: deploy-test
  image: $ALPINE_IMAGE
  services:
    - name: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      alias: orders-api
  needs: &all-gates
    - job: build-image
      artifacts: true
    - job: trivy-fs
      artifacts: false
    - job: trivy-config
      artifacts: false
    - job: trivy-image
      artifacts: false
    - job: checkov
      artifacts: false
    - job: gitleaks
      artifacts: false
    - job: kubeconform
      artifacts: false
    - job: kube-score
      artifacts: false
  script:
    - apk add --no-cache bash curl
    - |
      for i in $(seq 1 30); do
        curl -fsS -o /dev/null http://orders-api:8080/healthz && break
        echo "waiting for the service ($i/30)"
        sleep 1
      done
    - bash scripts/smoke.sh http://orders-api:8080

# Deploys the image to a throwaway Kubernetes cluster (kind, running inside
# the docker:dind service) and smoke-tests it there. Docker-in-Docker needs a
# privileged runner, so this job exists only when PRIVILEGED_RUNNER is "true".
# The cluster is always deleted.
deploy-test:
  stage: deploy-test
  extends: .dind
  rules:
    - if: $PRIVILEGED_RUNNER == "true"
  needs: *all-gates
  variables:
    # The kind node runs in the dind service, so the API server is reached at
    # the service alias, not localhost (see scripts/kind-up.sh).
    KIND_API_HOST: docker
  script:
    - apk add --no-cache bash curl
    - >
      sh scripts/fetch-verified.sh
      "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
      "$KIND_SHA256" /usr/local/bin/kind
    - >
      sh scripts/fetch-verified.sh
      "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      "$KUBECTL_SHA256" /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kind /usr/local/bin/kubectl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$IMAGE_REF"
    - bash scripts/kind-up.sh
    - bash scripts/deploy.sh "$IMAGE_REF"
    - bash scripts/smoke-k8s.sh orders-dev
    - bash scripts/netpol-check.sh orders-dev
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        bash scripts/k8s-diagnostics.sh orders-dev diagnostics || true
      fi
    - kind delete cluster --name orders-api || true
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - diagnostics/

# -------------------------------------------------------------- deploy ----

# Manual deploy of the tested digest to a real cluster. Needs the masked,
# protected KUBECONFIG_B64 variable; without it the script prints a notice and
# exits 0, so a project with no staging cluster still has a green pipeline.
# Rollback: kubectl -n orders-staging rollout undo deployment/orders-api
# (the script does this itself if the rollout fails). See docs/RUNBOOK.md.
deploy-staging:
  stage: deploy
  image: $ALPINE_IMAGE
  needs:
    - job: build-image
      artifacts: true
    - job: smoke-test
      artifacts: false
    - job: deploy-test
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true
  environment:
    name: staging
    deployment_tier: staging
  # One staging deploy at a time, and never cancelled halfway.
  resource_group: staging
  interruptible: false
  script:
    - apk add --no-cache bash curl
    - >
      sh scripts/fetch-verified.sh
      "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      "$KUBECTL_SHA256" /usr/local/bin/kubectl
    - chmod +x /usr/local/bin/kubectl
    - bash scripts/deploy-staging.sh

# ------------------------------------------------------------- release ----
# Tag pipelines only (vMAJOR.MINOR.PATCH). The image is not rebuilt: the
# digest that passed the gates in this pipeline gets the version tag.

release-image:
  stage: release
  image:
    name: $CRANE_IMAGE
    entrypoint: [""]
  needs:
    - job: build-image
      artifacts: true
    - job: smoke-test
      artifacts: false
    - job: deploy-test
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  interruptible: false
  script:
    - echo "$CI_REGISTRY_PASSWORD" | crane auth login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    # Registry-side retag: no pull, no rebuild, the digest cannot change.
    - crane tag "$IMAGE_REF" "$CI_COMMIT_TAG"
    - RELEASED="$(crane digest "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG")"
    - echo "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG -> $RELEASED"
    - test "$CI_REGISTRY_IMAGE@$RELEASED" = "$IMAGE_REF"
    - echo "RELEASE_IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" > release.env
    - echo "RELEASE_IMAGE_REF=$IMAGE_REF" >> release.env
  artifacts:
    reports:
      dotenv: release.env

release:
  stage: release
  image: $GLAB_IMAGE
  needs:
    - job: release-image
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    # Full history, so the notes can list commits since the previous tag.
    GIT_DEPTH: "0"
  script:
    - sh scripts/release-notes.sh "$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE" "$RELEASE_IMAGE_REF" > release-notes.md
    - cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "orders-api $CI_COMMIT_TAG"
    description: release-notes.md
  artifacts:
    expire_in: 90 days
    paths:
      - release-notes.md
