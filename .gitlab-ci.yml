---
# Pipeline for orders-api. docs/PIPELINE.md explains every stage and gate.
#
# Every image is pinned by tag and digest. To update one, change it here and
# in build/toolbox/Dockerfile (docs/RUNBOOK.md, "Updating pinned versions").

# One pipeline per change: merge request pipelines when an MR is open,
# branch pipelines otherwise, and tag pipelines for releases.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - build

variables:
  GO_IMAGE: "golang:1.27.2@sha256:007a316059246276cb214df93950be77837545dc78007a73e0291a4963d5d3bf"
  GOLANGCI_IMAGE: "golangci/golangci-lint:v2.14.0-alpine@sha256:25925c95ebdc7aee39ecc0e6f4f33ac27b9a91718bc65fdf18a1a5c4c9325ee4"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552"
  DOCKER_IMAGE: "docker:29.9.0-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00"
  DIND_IMAGE: "docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470"
  GOTESTSUM_VERSION: "v1.13.0"

  # Go caches live inside the project directory so GitLab can cache them.
  GOPATH: "$CI_PROJECT_DIR/.go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOLANGCI_LINT_CACHE: "$CI_PROJECT_DIR/.cache/golangci-lint"
  GOFLAGS: "-mod=readonly"

  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  IMAGE_BRANCH: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

default:
  interruptible: true
  timeout: 15 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.go-cache:
  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/
      - .cache/

# Docker-in-Docker with TLS between the job and the daemon.
.dind:
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - |
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "waiting for the docker daemon ($i/30)"
        sleep 2
      done
      docker info --format 'docker daemon {{.ServerVersion}} ready'

# ---------------------------------------------------------------- lint ----

go-lint:
  stage: lint
  image: $GOLANGCI_IMAGE
  extends: .go-cache
  needs: []
  script:
    - golangci-lint run --timeout 5m ./...

hadolint:
  stage: lint
  image: $HADOLINT_IMAGE
  needs: []
  script:
    - hadolint Dockerfile build/naive/Dockerfile build/distroless/Dockerfile build/toolbox/Dockerfile

# ---------------------------------------------------------------- test ----

go-test:
  stage: test
  # Full Debian-based Go image: the race detector needs cgo and a C compiler.
  image: $GO_IMAGE
  extends: .go-cache
  needs: []
  script:
    - go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
    - go vet ./...
    - >
      "$GOPATH/bin/gotestsum" --format testname --junitfile junit.xml --
      -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage.out
      - coverage.html
    reports:
      junit: junit.xml

# --------------------------------------------------------------- build ----

build-image:
  stage: build
  extends: .dind
  needs:
    - go-lint
    - hadolint
    - go-test
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >
      docker build --pull
      --build-arg "VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --tag "$IMAGE_SHA"
      --tag "$IMAGE_BRANCH"
      .
    - docker push "$IMAGE_SHA"
    - docker push "$IMAGE_BRANCH"
    # Later jobs use the digest, not a tag, so they scan and deploy exactly
    # the bytes that were built here.
    - IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_SHA")"
    - echo "IMAGE_REF=$IMAGE_REF" | tee build.env
    - echo "$IMAGE_REF" > image-digest.txt
    - docker image inspect --format '{{.Size}}' "$IMAGE_SHA" > image-size-bytes.txt
    - echo "image size on the runner $(cat image-size-bytes.txt) bytes"
  artifacts:
    expire_in: 30 days
    paths:
      - image-digest.txt
      - image-size-bytes.txt
    reports:
      dotenv: build.env
