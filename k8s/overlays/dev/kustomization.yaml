---
# Dev: one replica, the locally built image. Used by `make deploy` against
# kind and by the pipeline's deploy-test job.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orders-dev

resources:
  - ../../base

replicas:
  - name: orders-api
    count: 1

images:
  - name: orders-api
    newName: orders-api
    newTag: local

patches:
  - target:
      kind: Deployment
      name: orders-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: debug
      - op: add
        path: /metadata/annotations/checkov.io~1skip2
        value: >-
          CKV_K8S_15=Dev overlay only. The image is loaded into kind with
          kind load; there is no registry to pull from. Review 2027-04-13.
      # Same two dev-only relaxations for kube-score: local image, and one
      # replica is enough for a throwaway cluster. Prod is scored in full.
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-image-pull-policy,deployment-replicas
