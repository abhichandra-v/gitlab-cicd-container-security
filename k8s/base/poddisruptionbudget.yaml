---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-api
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: orders
spec:
  # A node drain may take down one pod at a time, never all of them.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
